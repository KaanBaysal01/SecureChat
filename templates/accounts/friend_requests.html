{% extends "base.html" %}
{% block title %}Arkadaşlık istekleri{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header"><strong>Gelen istekler</strong></div>
    <div class="list-group list-group-flush">
        {% for req in incoming %}
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>{{ req.from_user.username }}</span>
                <div class="d-flex gap-2">
                    <form method="post" action="{% url 'accounts:accept_friend_request' req.id %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-success">Kabul et</button>
                    </form>
                    <form method="post" action="{% url 'accounts:reject_friend_request' req.id %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Reddet</button>
                    </form>
                </div>
            </div>
        {% empty %}
            <div class="list-group-item text-muted">Bekleyen istek yok.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
