{% extends "base.html" %}
{% block title %}Arkadaşlarım{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header"><strong>Arkadaşlarım</strong></div>
    <div class="list-group list-group-flush">
        {% for f in friends %}
        <div class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ f.username }}</span>
            <form method="post" action="{% url 'accounts:remove_friend' f.id %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-danger">Çıkar</button>
            </form>
        </div>
        {% empty %}
            <div class="list-group-item text-muted">Henüz arkadaşın yok.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
