<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SecureChat{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">SecureChat</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <a class="nav-link text-light" href="{% url 'chat:conversation_list' %}">Sohbetlerim</a>
                <a class="nav-link text-light" href="{% url 'accounts:user_list' %}">Kullanıcılar</a>
                <a class="nav-link text-light" href="{% url 'accounts:friend_requests' %}">İstekler</a>
                <a class="nav-link text-light" href="{% url 'accounts:friend_list' %}">Arkadaşlar</a>
                <span class="text-secondary small">{{ user.username }}</span>
                <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Çıkış</button>
                </form>
            {% else %}
                <a class="nav-link text-light" href="{% url 'accounts:login' %}">Giriş</a>
                <a class="nav-link text-light" href="{% url 'accounts:register' %}">Kayıt ol</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width: 720px;">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
